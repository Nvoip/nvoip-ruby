name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: ruby -c lib/nvoip.rb
      - run: ruby -c lib/nvoip/client.rb
      - run: for file in examples/*.rb; do ruby -c "$file"; done
      - run: ruby -Itest test/client_test.rb
      - run: gem build nvoip-ruby.gemspec
